name: Comment shortlist
on:
  schedule:
    - cron: "41 21 * * 5"
  workflow_dispatch:
  push:
    paths: [".github/engage-trigger"]
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find posts
        env:
          IG_TOKEN_RETAINED: ${{ secrets.IG_TOKEN_RETAINED }}
          IG_TOKEN_RETURNPOLICY: ${{ secrets.IG_TOKEN_RETURNPOLICY }}
        run: |
          mkdir -p stats
          python3 scripts/engage.py 2>&1 | tee stats/engage-log.txt || true
          python3 scripts/study.py 2>&1 | tee -a stats/engage-log.txt || true
      - name: Save
        run: |
          git config user.name "content-bot"; git config user.email "content-bot@users.noreply.github.com"
          git add -A stats; git commit -qm "Comment shortlist" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
