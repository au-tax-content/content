name: Check setup
on:
  workflow_dispatch:
  push:
    paths: [".github/check-trigger"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Instagram tokens
        env:
          IG_TOKEN_RETAINED: ${{ secrets.IG_TOKEN_RETAINED }}
          IG_TOKEN_RETURNPOLICY: ${{ secrets.IG_TOKEN_RETURNPOLICY }}
        run: |
          mkdir -p stats
          python3 scripts/check_tokens.py 2>&1 | tee stats/setup-check.txt || true
          date -u >> stats/setup-check.txt
      - name: Save result
        run: |
          git config user.name "content-bot"; git config user.email "content-bot@users.noreply.github.com"
          git add stats/setup-check.txt; git commit -qm "Setup check result" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
